<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas 🌻</title>
<meta name="description" content="Un ramo de girasoles hecho con cariño para ti.">
<meta property="og:title" content="Feliz Día de las Flores Amarillas 🌻">
<meta property="og:description" content="Tengo un ramo de girasoles para ti. Ábrelo.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2f6f70">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@1,700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-top: #35543f;
    --bg-mid: #3a8585;
    --bg-low: #35989a;
    --yellow: #f7ff1a;
    --cyan: #1fd6ff;
    --sun: #ffc61a;
    --paper: #fff8e1;
    --ink: #4a3410;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 55%, var(--bg-low) 0%, var(--bg-mid) 55%, #2c6a6b 100%),
      var(--bg-mid);
    font-family: "Playfair Display", Georgia, serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }
  /* sombra superior, como en la referencia */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(to bottom, rgba(38,58,40,.85) 0%, rgba(38,58,40,0) 28%);
    pointer-events: none;
    z-index: 1;
  }

  #fireflies { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  .grass { position: fixed; bottom: 0; width: 34vw; max-width: 420px; height: 55vh; opacity: .32; z-index: 1; pointer-events: none; }
  .grass.left { left: 2vw; }
  .grass.right { right: 2vw; transform: scaleX(-1); }

  /* ---------- Página ---------- */
  .page {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: max(env(safe-area-inset-top), 14px) 12px max(env(safe-area-inset-bottom), 10px);
  }

  header { text-align: center; flex: none; padding-top: clamp(4px, 2vh, 24px); }

  h1 {
    font-family: "Dancing Script", "Brush Script MT", cursive;
    font-weight: 700;
    font-size: clamp(2.1rem, 6.4vw, 4.4rem);
    line-height: 1.05;
    color: var(--yellow);
    text-shadow: 0 0 6px rgba(247,255,26,.9), 0 0 22px rgba(247,255,26,.55), 0 0 44px rgba(255,214,0,.35);
    opacity: 0;
    animation: titleIn 1.6s ease-out 1.9s forwards;
  }
  .sub {
    margin-top: .35rem;
    font-style: italic; font-weight: 700;
    font-size: clamp(1.15rem, 3.2vw, 2rem);
    color: var(--cyan);
    text-shadow: 0 0 10px rgba(31,214,255,.7);
    opacity: 0;
    animation: titleIn 1.4s ease-out 2.5s forwards;
  }
  @keyframes titleIn {
    from { opacity: 0; filter: blur(6px); transform: translateY(-8px); }
    to   { opacity: 1; filter: blur(0);  transform: none; }
  }

  main { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; }
  #bouquet { height: 100%; width: 100%; max-width: 760px; overflow: visible; filter: drop-shadow(0 18px 30px rgba(0,0,0,.25)); }

  .flower { cursor: pointer; outline: none; }
  .flower:focus-visible .bloom { filter: drop-shadow(0 0 10px #fff); }
  .bloom { transform-origin: 0 0; animation: bloom 1.3s cubic-bezier(.2, 1.35, .4, 1) both; }
  .sway  { transform-origin: 0 0; animation: sway 6s ease-in-out infinite alternate; }
  @keyframes bloom { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes sway  { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }

  .stem, .leaf, .wrap { animation: fadeUp 1s ease-out both; }
  .wrap { animation-delay: .9s; }
  @keyframes fadeUp { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Mariposas y pétalos ---------- */
  .bf { position: fixed; left: 0; top: 0; width: 42px; height: 32px; z-index: 3; pointer-events: none; will-change: transform; }
  .bf svg { width: 100%; height: 100%; overflow: visible; animation: flap .32s ease-in-out infinite alternate; transform-origin: 50% 50%; filter: drop-shadow(0 0 5px currentColor); }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.35); } }

  .petal {
    position: fixed; z-index: 4; pointer-events: none;
    width: 11px; height: 18px;
    background: linear-gradient(#ffd93a, #ff9d00);
    border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
    will-change: transform, opacity;
  }

  .toast {
    position: fixed; z-index: 6; pointer-events: none;
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: #fff7b0;
    text-shadow: 0 0 10px rgba(255,220,0,.9), 0 2px 6px rgba(0,0,0,.4);
    white-space: nowrap;
    transform: translate(-50%, -50%);
  }

  .hint {
    position: fixed; left: 50%; bottom: max(env(safe-area-inset-bottom), 14px); z-index: 5;
    transform: translateX(-50%);
    font-size: .95rem; font-style: italic;
    color: rgba(255,255,255,.85);
    background: rgba(20,60,60,.45);
    padding: .4rem .9rem; border-radius: 999px;
    opacity: 0; animation: hintIn 1s ease-out 4.2s forwards;
    transition: opacity .6s;
    pointer-events: none;
  }
  .hint.gone { opacity: 0 !important; animation: none; }
  @keyframes hintIn { to { opacity: 1; } }

  /* ---------- Botones flotantes ---------- */
  .fab {
    position: fixed; z-index: 7;
    width: 68px; height: 68px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(30,90,90,.45);
    border: 2px solid var(--sun);
    color: var(--sun);
    cursor: pointer;
    box-shadow: 0 0 18px rgba(255,198,26,.55), inset 0 0 12px rgba(255,198,26,.25);
    transition: transform .2s, box-shadow .2s;
  }
  .fab:hover, .fab:focus-visible { transform: scale(1.08); box-shadow: 0 0 28px rgba(255,198,26,.9), inset 0 0 14px rgba(255,198,26,.35); outline: none; }
  .fab svg { width: 34px; height: 34px; }
  #openLetter { right: max(env(safe-area-inset-right), 22px); bottom: max(env(safe-area-inset-bottom), 22px); }
  #openLetter::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--sun); opacity: 0;
    animation: ping 2.4s ease-out 5s infinite;
  }
  #openLetter.seen::after { animation: none; }
  @keyframes ping { 0% { transform: scale(.85); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }

  #music { left: max(env(safe-area-inset-left), 22px); bottom: max(env(safe-area-inset-bottom), 22px); width: 52px; height: 52px; display: none; }
  #music.on-config { display: grid; }
  #music svg { width: 24px; height: 24px; }

  /* ---------- Carta ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: none; place-items: center;
    background: rgba(10,40,40,.62);
    backdrop-filter: blur(4px);
    padding: 16px;
  }
  .overlay.open { display: grid; }

  .letter {
    position: relative;
    width: min(560px, 100%);
    max-height: 86vh; overflow-y: auto;
    background:
      repeating-linear-gradient(to bottom, transparent 0 33px, rgba(150,110,40,.16) 33px 34px),
      var(--paper);
    color: var(--ink);
    border-radius: 6px 6px 14px 14px;
    padding: 34px 30px 30px;
    box-shadow: 0 30px 70px rgba(0,0,0,.5);
    transform-origin: 50% 100%;
    animation: unfold .7s cubic-bezier(.2, .9, .3, 1) both;
  }
  @keyframes unfold { from { transform: translateY(40px) scale(.7, .2); opacity: 0; } to { transform: none; opacity: 1; } }
  .letter::before {
    content: "🌻"; position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 2.6rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,.3));
  }
  .letter h2 { font-family: "Dancing Script", cursive; font-size: 2.1rem; color: #b06a00; margin-bottom: .5rem; }
  #letterText { font-family: "Caveat", "Dancing Script", cursive; font-size: 1.6rem; line-height: 34px; font-weight: 500; white-space: pre-wrap; min-height: 6em; }
  .why { margin-top: 1.1rem; padding-top: .9rem; border-top: 1px dashed rgba(150,110,40,.5); font-size: .92rem; line-height: 1.5; color: #6b5220; font-style: normal; font-family: Georgia, serif; opacity: 0; transition: opacity 1s; }
  .why.show { opacity: 1; }
  .close {
    position: absolute; top: 8px; right: 10px; width: 40px; height: 40px;
    border: 0; background: transparent; cursor: pointer; font-size: 1.8rem; line-height: 1; color: #9a6a12;
    border-radius: 50%;
  }
  .close:hover, .close:focus-visible { background: rgba(176,106,0,.12); outline: none; }

  @media (max-width: 520px) {
    .letter { padding: 30px 20px 24px; }
    #letterText { font-size: 1.4rem; }
    .fab { width: 60px; height: 60px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bloom, .sway, .stem, .leaf, .wrap, .bf svg, #openLetter::after { animation: none !important; }
    h1, .sub, .hint { animation-duration: .01s !important; animation-delay: 0s !important; }
  }
</style>
</head>

<body>
<canvas id="fireflies" aria-hidden="true"></canvas>

<!-- Pasto decorativo -->
<svg class="grass left" viewBox="0 0 300 500" aria-hidden="true">
  <g fill="none" stroke="#1f5a2c" stroke-width="7" stroke-linecap="round">
    <path d="M60 500 C 50 380, 70 250, 110 120"/>
    <path d="M110 500 C 105 390, 140 300, 200 200"/>
    <path d="M25 500 C 25 430, 15 380, 35 300"/>
    <path d="M160 500 C 165 430, 190 400, 240 370"/>
  </g>
</svg>
<svg class="grass right" viewBox="0 0 300 500" aria-hidden="true">
  <g fill="none" stroke="#1f5a2c" stroke-width="7" stroke-linecap="round">
    <path d="M60 500 C 50 380, 70 250, 110 120"/>
    <path d="M110 500 C 105 390, 140 300, 200 200"/>
    <path d="M25 500 C 25 430, 15 380, 35 300"/>
    <path d="M160 500 C 165 430, 190 400, 240 370"/>
  </g>
</svg>

<div class="page">
  <header>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <main>
    <svg id="bouquet" viewBox="0 0 600 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Ramo de girasoles">
      <defs>
        <linearGradient id="petalBack" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff8f00"/>
        </linearGradient>
        <linearGradient id="petalFront" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe45c"/><stop offset="1" stop-color="#ffab00"/>
        </linearGradient>
        <radialGradient id="disc" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#2a1706"/><stop offset=".72" stop-color="#3a220a"/><stop offset="1" stop-color="#6b4416"/>
        </radialGradient>
        <pattern id="seeds" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <circle cx="3.5" cy="3.5" r="1.1" fill="#b57a30" opacity=".45"/>
        </pattern>
        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7c7cf" stop-opacity=".78"/><stop offset="1" stop-color="#ff8f9e" stop-opacity=".88"/>
        </linearGradient>
        <linearGradient id="paperLight" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe6ea" stop-opacity=".7"/><stop offset="1" stop-color="#f4a6b3" stop-opacity=".45"/>
        </linearGradient>
      </defs>
      <g id="stems"></g>
      <g id="leaves"></g>
      <g id="flowers"></g>

      <!-- Papel de envolver -->
      <g class="wrap">
        <path d="M100 385 L500 385 L378 712 L222 712 Z" fill="url(#paper)"/>
        <path d="M100 385 L245 470 L222 712 Z" fill="url(#paperLight)"/>
        <path d="M500 385 L355 470 L378 712 Z" fill="url(#paperLight)"/>
        <path d="M245 470 L355 470 L300 712 Z" fill="#ffb3bf" fill-opacity=".35"/>
      </g>
      <!-- Moño -->
      <g class="wrap" style="animation-delay:1.2s">
        <ellipse cx="238" cy="482" rx="62" ry="20" transform="rotate(-8 238 482)" fill="#ffd500"/>
        <ellipse cx="362" cy="482" rx="62" ry="20" transform="rotate(8 362 482)" fill="#ffd500"/>
        <circle cx="300" cy="488" r="15" fill="#f4b800"/>
      </g>
    </svg>
  </main>
</div>

<p class="hint" id="hint">Toca cada Girasol que hay un hermoso mensaje para Tí 🌻</p>

<button class="fab" id="music" aria-label="Activar o silenciar música">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
</button>

<button class="fab" id="openLetter" aria-label="Abrir la carta">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 9h8M8 13h8"/><path d="M3 10l9 6 9-6"/></svg>
</button>

<div class="overlay" id="overlay">
  <article class="letter" role="dialog" aria-modal="true" aria-labelledby="letterTo">
    <button class="close" id="closeLetter" aria-label="Cerrar carta">×</button>
    <h2 id="letterTo"></h2>
    <div id="letterText"></div>
    <p class="why" id="why"></p>
  </article>
</div>

<audio id="audio" loop preload="none"></audio>

<script>
/* =====================================================================
   ✏️  PERSONALIZA AQUÍ  (solo edita lo que está entre comillas)
   ===================================================================== */
const CONFIG = {
  titulo:   "Feliz Día De Las Flores Amarillas Señorita",
  subtitulo:"Ten tu ramo de Girasoles con mucho cariño Kathy",

  para: "Nombre de tu amiga",     // ← el nombre de ella
  de:   "Tu nombre",              // ← tu nombre

  // Cada elemento es un párrafo de la carta
  carta: [
    "Hoy es 21 de septiembre y quise regalarte algo que no se marchita: este ramo de girasoles, hecho con cariño solo para ti.",
    "Gracias por tu risa, por tu compañía y por ser tan especial en mi vida. Me alegra un montón tenerte cerca.",
    "Ojalá esta primavera te traiga días luminosos, cosas bonitas y muchas razones para sonreír."
  ],
  despedida: "Con mucho cariño,",

  // Frases que aparecen al tocar cada girasol
  frases: [
    "Eres luz ☀️",
    "Gracias por existir",
    "Que sonrías siempre",
    "Contigo todo es más bonito",
    "Mereces cosas lindas",
    "Feliz primavera 🌸"
  ],

  // Texto pequeño al final de la carta (puedes borrarlo dejando "")
  porQue: "Las flores amarillas simbolizan alegría, esperanza y nuevos comienzos. Cada 21 de septiembre se regalan en Perú como gesto de cariño.",

  // Música (opcional): sube un .mp3 al repositorio y escribe su nombre, ej. "musica.mp3"
  musica: ""
};
/* ===================================================================== */

const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

$("#title").textContent = CONFIG.titulo;
$("#subtitle").textContent = CONFIG.subtitulo;
document.title = CONFIG.titulo + " 🌻";

/* ---------- Girasoles (SVG generado) ---------- */
function el(name, attrs, parent) {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function petalPath(R, c, w) {
  const L = R;
  return `M0 ${-c} C ${w} ${-c - .3 * (L - c)}, ${w * .85} ${-.82 * L}, 0 ${-L} ` +
         `C ${-w * .85} ${-.82 * L}, ${-w} ${-c - .3 * (L - c)}, 0 ${-c} Z`;
}

function ring(g, count, R, c, w, fill, offset) {
  for (let i = 0; i < count; i++) {
    const a = (360 / count) * i + offset;
    el("path", { d: petalPath(R, c, w), fill, transform: `rotate(${a})` }, g);
  }
}

// x, y, radio, retraso de apertura (s)
const FLOWERS = [
  { x: 300, y: 140, r: 84, d: .0 },
  { x: 170, y: 215, r: 80, d: .25 },
  { x: 430, y: 212, r: 82, d: .5 },
  { x: 305, y: 232, r: 78, d: .75 },
  { x: 235, y: 320, r: 84, d: 1.0 },
  { x: 372, y: 322, r: 82, d: 1.25 }
];

function buildBouquet() {
  const stems = $("#stems"), leaves = $("#leaves"), flowers = $("#flowers");

  FLOWERS.forEach((f, i) => {
    // tallo
    el("path", {
      d: `M${f.x} ${f.y} Q ${f.x + (300 - f.x) * .15} ${f.y + 230} 300 660`,
      fill: "none", stroke: "#3c8a3a", "stroke-width": 9, "stroke-linecap": "round", class: "stem"
    }, stems);

    // flor
    const outer = el("g", { transform: `translate(${f.x} ${f.y})`, class: "flower", tabindex: 0, role: "button", "aria-label": "Girasol" }, flowers);
    const bloom = el("g", { class: "bloom", style: `animation-delay:${.3 + f.d}s` }, outer);
    const sway = el("g", { class: "sway", style: `animation-duration:${5 + i * .7}s; animation-delay:${-i}s` }, bloom);

    const R = f.r, tilt = (i * 37) % 15;
    const g = el("g", { transform: `rotate(${tilt})` }, sway);
    ring(g, 24, R, R * .3, R * .15, "url(#petalBack)", 0);
    ring(g, 24, R * .9, R * .3, R * .14, "url(#petalFront)", 7.5);
    el("circle", { r: R * .37, fill: "url(#disc)", stroke: "#2a1706", "stroke-width": 2 }, g);
    el("circle", { r: R * .34, fill: "url(#seeds)" }, g);
    el("circle", { r: R * .37, fill: "none", stroke: "#8a5a1c", "stroke-width": 1.5, opacity: .6 }, g);

    const trigger = (ev) => {
      const rect = outer.getBoundingClientRect();
      const px = ev && ev.clientX ? ev.clientX : rect.left + rect.width / 2;
      const py = ev && ev.clientY ? ev.clientY : rect.top + rect.height / 2;
      onFlowerTouch(sway, px, py, rect);
    };
    outer.addEventListener("click", trigger);
    outer.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); trigger(); } });
  });

  // hojas
  [[150, 372, -35], [455, 366, 35], [205, 400, -15], [400, 402, 15]].forEach(([x, y, rot]) => {
    el("ellipse", { cx: x, cy: y, rx: 50, ry: 20, transform: `rotate(${rot} ${x} ${y})`, fill: "#3f8f3a", class: "leaf", opacity: .95 }, leaves);
  });
}
buildBouquet();

/* ---------- Interacción con girasoles ---------- */
let phraseIdx = 0;
function onFlowerTouch(swayEl, x, y, rect) {
  $("#hint").classList.add("gone");
  if (!reduceMotion) swayEl.animate([{ transform: "rotate(0deg) scale(1)" }, { transform: "rotate(360deg) scale(1.08)" }, { transform: "rotate(360deg) scale(1)" }], { duration: 900, easing: "ease-in-out" });

  const frase = CONFIG.frases[phraseIdx++ % CONFIG.frases.length];
  showToast(frase, x, y);
  for (let i = 0; i < 9; i++) dropPetal(rect.left + Math.random() * rect.width, rect.top + rect.height * (.3 + Math.random() * .4));
  spawnButterfly(x, y, true);
}

function showToast(text, x, y) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text;
  t.style.left = x + "px"; t.style.top = y + "px";
  document.body.appendChild(t);
  const a = t.animate([
    { opacity: 0, transform: "translate(-50%,-30%) scale(.8)" },
    { opacity: 1, transform: "translate(-50%,-90%) scale(1)", offset: .25 },
    { opacity: 1, transform: "translate(-50%,-140%) scale(1)", offset: .75 },
    { opacity: 0, transform: "translate(-50%,-190%) scale(1)" }
  ], { duration: 2400, easing: "ease-out" });
  a.onfinish = () => t.remove();
}

/* ---------- Pétalos ---------- */
function dropPetal(x, y) {
  if (reduceMotion) return;
  const p = document.createElement("div");
  p.className = "petal";
  p.style.left = x + "px"; p.style.top = y + "px";
  document.body.appendChild(p);
  const dx = (Math.random() - .5) * 220, dy = innerHeight - y + 40;
  const rot = (Math.random() - .5) * 900;
  const a = p.animate([
    { transform: "translate(0,0) rotate(0)", opacity: 1 },
    { transform: `translate(${dx * .5}px, ${dy * .5}px) rotate(${rot * .5}deg)`, opacity: 1, offset: .6 },
    { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
  ], { duration: 3800 + Math.random() * 2500, easing: "ease-in" });
  a.onfinish = () => p.remove();
}
if (!reduceMotion) setInterval(() => dropPetal(Math.random() * innerWidth, -20), 2600);

/* ---------- Mariposas ---------- */
const BF_COLORS = ["#ffe9c9", "#ffd21a", "#ffffff", "#ffc24a", "#fff3a8"];
const BF_SVG = (c) => `
<svg viewBox="0 0 40 30" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:${c}">
  <path d="M20 15 C15 0 2 1 4 11 C5 17 13 18 20 15 Z"/>
  <path d="M20 15 C16 18 7 22 10 27 C14 31 19 23 20 15 Z"/>
  <path d="M20 15 C25 0 38 1 36 11 C35 17 27 18 20 15 Z"/>
  <path d="M20 15 C24 18 33 22 30 27 C26 31 21 23 20 15 Z"/>
</svg>`;

function wander(node, startX, startY, loop) {
  const pts = [[startX, startY]];
  const n = 5;
  for (let i = 0; i < n; i++) pts.push([Math.random() * (innerWidth - 60), Math.random() * (innerHeight - 100) + 20]);
  if (loop) pts.push([startX, startY]);
  const frames = pts.map((p, i) => {
    const q = pts[Math.min(i + 1, pts.length - 1)];
    const ang = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI + 90;
    return { transform: `translate(${p[0]}px, ${p[1]}px) rotate(${ang}deg)`, offset: i / (pts.length - 1) };
  });
  return node.animate(frames, { duration: 26000 + Math.random() * 16000, iterations: loop ? Infinity : 1, easing: "ease-in-out", fill: "forwards" });
}

function spawnButterfly(x, y, temporary) {
  const b = document.createElement("div");
  b.className = "bf";
  b.innerHTML = BF_SVG(BF_COLORS[Math.floor(Math.random() * BF_COLORS.length)]);
  document.body.appendChild(b);
  if (reduceMotion) { b.style.transform = `translate(${x}px, ${y}px)`; return; }
  const a = wander(b, x, y, !temporary);
  if (temporary) a.onfinish = () => { b.style.transition = "opacity 1s"; b.style.opacity = 0; setTimeout(() => b.remove(), 1000); };
}
for (let i = 0; i < 7; i++) spawnButterfly(Math.random() * innerWidth, Math.random() * innerHeight, false);

// tocar el fondo también suelta una mariposa
document.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".flower, .fab, .overlay")) return;
  spawnButterfly(e.clientX, e.clientY, true);
});

/* ---------- Luciérnagas (canvas) ---------- */
(function fireflies() {
  const cv = $("#fireflies"), ctx = cv.getContext("2d");
  let w, h, dpr, parts = [];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.width = innerWidth * dpr; h = cv.height = innerHeight * dpr;
    const n = Math.round((innerWidth * innerHeight) / 14000);
    parts = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.8 + .8) * dpr,
      vx: (Math.random() - .5) * .25 * dpr, vy: (Math.random() - .5) * .25 * dpr,
      ph: Math.random() * Math.PI * 2, sp: .01 + Math.random() * .02,
      c: Math.random() < .75 ? "255,225,40" : "190,255,120"
    }));
  }
  function frame() {
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      if (!reduceMotion) {
        p.x += p.vx; p.y += p.vy; p.ph += p.sp;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      }
      const a = .35 + .65 * Math.abs(Math.sin(p.ph));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, `rgba(${p.c},${a})`); g.addColorStop(1, `rgba(${p.c},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 5, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  resize(); frame();
})();

/* ---------- Carta ---------- */
const overlay = $("#overlay"), letterText = $("#letterText"), why = $("#why");
let typing = null, fullText = "";

function buildLetter() {
  $("#letterTo").textContent = `Para ${CONFIG.para} 🌻`;
  fullText = CONFIG.carta.join("\n\n") + `\n\n${CONFIG.despedida}\n${CONFIG.de}`;
  why.textContent = CONFIG.porQue || "";
  if (!CONFIG.porQue) why.style.display = "none";
}
buildLetter();

function typeLetter() {
  clearInterval(typing);
  letterText.textContent = ""; why.classList.remove("show");
  if (reduceMotion) { letterText.textContent = fullText; why.classList.add("show"); return; }
  let i = 0;
  typing = setInterval(() => {
    i += 2;
    letterText.textContent = fullText.slice(0, i);
    if (i >= fullText.length) finishTyping();
  }, 28);
}
function finishTyping() {
  clearInterval(typing);
  letterText.textContent = fullText;
  why.classList.add("show");
}

let lastFocus = null;
function openLetter() {
  lastFocus = document.activeElement;
  overlay.classList.add("open");
  $("#openLetter").classList.add("seen");
  $("#hint").classList.add("gone");
  typeLetter();
  $("#closeLetter").focus();
  for (let i = 0; i < 14; i++) setTimeout(() => dropPetal(Math.random() * innerWidth, -20), i * 120);
}
function closeLetter() {
  overlay.classList.remove("open");
  clearInterval(typing);
  if (lastFocus) lastFocus.focus();
}
$("#openLetter").addEventListener("click", openLetter);
$("#closeLetter").addEventListener("click", closeLetter);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closeLetter(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && overlay.classList.contains("open")) closeLetter(); });
letterText.addEventListener("click", finishTyping);

/* ---------- Música (opcional) ---------- */
if (CONFIG.musica) {
  const audio = $("#audio"), btn = $("#music");
  audio.src = CONFIG.musica; audio.volume = .6;
  btn.classList.add("on-config");
  btn.addEventListener("click", () => {
    if (audio.paused) { audio.play().catch(() => {}); btn.style.opacity = 1; }
    else { audio.pause(); btn.style.opacity = .55; }
  });
  btn.style.opacity = .55;
}
</script>
